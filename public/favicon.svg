<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Fondo negro para buen contraste -->
  <rect width="256" height="256" fill="#0F0F0F"/>

  <!-- Halo morado suave para dar profundidad -->
  <circle cx="128" cy="128" r="115" fill="#8839EA" opacity="0.15"/>

  <!-- Letra G blanca centrada -->
  <text x="128" y="158" font-family="'DejaVu Sans', sans-serif" font-size="140" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">G</text>

  <!-- Detalle morado en la esquina superior derecha -->
  <circle cx="192" cy="74" r="14" fill="#8839EA"/>

  <!-- Borde sutil morado para separar en fondos claros/oscuro -->
  <circle cx="128" cy="128" r="115" fill="none" stroke="#8839EA" stroke-width="2" opacity="0.3"/>
</svg>
