<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="bottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <!-- Dark circular background -->
  <circle cx="256" cy="256" r="256" fill="#0f0f1e"/>
  <!-- Diamond: top half (upper beak) -->
  <polygon points="256,48 448,256 256,256 64,256" fill="url(#top)"/>
  <!-- Diamond: bottom half (lower beak / open mouth) -->
  <polygon points="256,256 448,256 256,464 64,256" fill="url(#bottom)"/>
</svg>
